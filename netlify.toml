[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Every 5 minutes: expire stale holds, send reminders, retry half-finished
# fulfillment. The function just calls /api/cron/tick with CRON_SECRET.
[functions."cron-tick"]
  schedule = "*/5 * * * *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# /bridge is rendered inside the Recall bot's browser, which needs the mic
# and must not be framed-blocked by our default policy.
[[headers]]
  for = "/bridge"
  [headers.values]
    Permissions-Policy = "camera=(self), microphone=(self)"
